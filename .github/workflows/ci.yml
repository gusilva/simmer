name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Test
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # lint compares against the base branch

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Fails on a Go file excluded from the build by its filename rather than
      # a //go:build line. Such a file compiles nowhere while every other
      # check stays green, so it has to be caught on its own.
      - name: Check build exclusions
        run: make exclusions

      - name: Check formatting
        run: make fmt-check

      - name: Run go vet
        run: make vet

      - name: Run tests with coverage
        run: make test-race

      # Unreachable from both the binary and the tests. Kept blocking: the
      # tree is clean, and the 1,300-line modal that survived here for months
      # is what it exists to prevent.
      - name: Check for dead code
        run: make deadcode

      - name: Build CLI
        run: make build

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  lint:
    name: Lint
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Scoped to the diff: the tree carries a backlog of findings that
      # predates this job, and failing every PR on them would train people to
      # ignore it. New code is held to the full standard.
      #
      # The version is pinned and must be built with a Go at least as new as
      # go.mod targets, or it refuses to load the config. action@v6 defaulted
      # to golangci-lint 1.64 (built with go1.24) against a go1.25 module.
      # Keep this in step with the version developers run locally.
      - name: golangci-lint (new code)
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          args: --new-from-rev=origin/${{ github.base_ref || 'main' }} --timeout=5m
